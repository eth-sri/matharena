cache_read_cost: 0.003
write_cost: 0.60
reasoning_effort: max
concurrent_requests: 32
human_readable_id: DeepSeek-V4.1-Flash (Max)
date: "2026-09-10"
extra_body:
  provider:
    only:
    - fireworks
    allow_fallbacks: false
other_params:
