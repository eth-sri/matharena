# Official hosted version of Qwen/Qwen3.8-Flash-Next.
# https://openrouter.ai/qwen/qwen3.8-flash
model: qwen/qwen3.8-flash
api: openrouter
harness: qwen
harness_version: "0.24.0"
harness_config:
  auth: api
  container_executable: qwen
  environment:
    # Allow long reasoning streams; keep inactivity timeouts enabled.
    QWEN_STREAM_MAX_LIFETIME_MS: "0"
max_tokens: 131072
temperature: 1.0
top_p: 0.95
concurrent_requests: 64
reasoning_effort: xhigh
# Alibaba pricing through OpenRouter (USD per million tokens).
cache_read_cost: 0.016
read_cost: 0.15
write_cost: 0.47
human_readable_id: Qwen3.8-Flash-Next
date: "2026-08-26"
extra_body:
  provider:
    allow_fallbacks: false
    order:
    - alibaba
  top_k: 20
other_params:
  open: true
  creator: Qwen
  # Reported model size; excludes 51B n-gram embeddings and 4B MTP.
  # https://huggingface.co/Qwen/Qwen3.8-Flash-Next
  parameters: 125
  active_parameters: 6
  huggingface_id: Qwen/Qwen3.8-Flash-Next
