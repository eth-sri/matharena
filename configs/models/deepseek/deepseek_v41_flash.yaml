model: deepseek/deepseek-v4.1-flash
api: openrouter
# Deep Code runs locally; OPENROUTER_API_KEY pays for DeepSeek-only routing.
harness: deepcode
harness_version: "0.3.1"
harness_config:
  auth: api
  container_executable: deepcode
  cpu_limit: 4
  memory_gb: 12
  pids_limit: 768
