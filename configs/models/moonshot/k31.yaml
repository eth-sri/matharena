model: moonshotai/kimi-k3.1-pro
api: openrouter
harness: kimi
harness_version: "2.3.1"
harness_config:
  auth: api
  container_executable: kimi
  environment:
    KIMI_MODEL_MAX_CONTEXT_SIZE: "1048576"
    # Kimi Code clamps this to the remaining context on each request. Kimi Code
    # 2.3.1 also caps Chat Completions output at 131072, so that is the sent value.
    KIMI_MODEL_MAX_OUTPUT_SIZE: "500000"
    CHOKIDAR_USEPOLLING: "1"
# No max_tokens: the host bridge would force it on every request and bypass
# Kimi Code's clamp, so OpenRouter rejects input + max_tokens > 1048576.
# Sampling is fixed at temperature 1.0 / top_p 0.95; use native defaults.
concurrent_requests: 16
read_cost: 2.0
cache_read_cost: 0.2
write_cost: 10.0
context_limit: 1048576
human_readable_id: Kimi K3.1 Pro
date: "2026-10-23"
reasoning_effort: max
extra_body:
  provider:
    # Pin the standard endpoint to match the configured token prices.
    only:
      - moonshotai/mxfp4
    allow_fallbacks: false
    require_parameters: true
other_params:
  open: true
  creator: Moonshot AI
